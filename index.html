<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Performance: warm up origins used by every deploy (fonts CSS+files, hero
         images, Firestore config). Saves ~100-300ms of DNS+TLS on first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Base font stylesheet lives here (not as CSS @import) so the browser
         discovers it in parallel with the JS/CSS bundles instead of after
         downloading the CSS bundle. Same URL previously in src/index.css. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700;900&family=Frank+Ruhl+Libre:wght@300;400;500;700&family=Heebo:wght@300;400;500;600;700&family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Cairo:wght@300;400;500;600;700&display=swap"
    />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com" />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />

    <!-- theme-color: rewritten per-tenant by vite-plugin-seo (brand accent) -->
    <meta name="theme-color" content="#d97706" />
    <!-- Evita flash claro: escritorio siempre dark; móvil respeta vite-ui-theme -->
    <script>
      (function () {
        try {
          var desktop = window.matchMedia("(min-width: 768px)").matches;
          var stored = localStorage.getItem("vite-ui-theme");
          var root = document.documentElement;
          root.classList.remove("light", "dark");
          if (desktop || stored !== "light") {
            root.classList.add("dark");
          } else {
            root.classList.add("light");
          }
        } catch (e) {}
      })();
    </script>

    <!--
    ╔══════════════════════════════════════════════════════════════════════════════╗
    ║  MASTER TEMPLATE — DEFAULT SEO & SOCIAL PREVIEW                               ║
    ║  Static placeholders below. At runtime, `src/hooks/useSEO.ts` overwrites      ║
    ║  title, description, and Open Graph tags from `siteConfig.brand`.            ║
    ╚══════════════════════════════════════════════════════════════════════════════╝
    -->

    <!-- Favicon: runtime-set by useSEO.ts from brand.faviconEmoji; generic fallback below -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23d97706'/><text x='16' y='23' font-size='18' text-anchor='middle' fill='white' font-family='system-ui'>%E2%9C%A8</text></svg>" type="image/svg+xml" />

    <title>ONYX &amp; STEEL — The Modern Gentleman's Sanctuary</title>
    <meta name="robots" content="index, follow" />
    <meta
      name="description"
      content="A premier grooming destination where time-honored artistry meets contemporary precision. Book your exclusive grooming experience."
    />

    <!-- Open Graph & Twitter — static fallbacks; useSEO.ts sets absolute URLs at runtime -->
    <meta property="og:title" content="ONYX &amp; STEEL — The Modern Gentleman's Sanctuary" />
    <meta
      property="og:description"
      content="A premier grooming destination where time-honored artistry meets contemporary precision. Book your exclusive grooming experience."
    />
    <meta property="og:url" content="https://barber-shop-template-ten.vercel.app/" />
    <meta property="og:locale" content="en_US" />
    <link rel="canonical" href="https://barber-shop-template-ten.vercel.app/" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1532710093739-9470acff878f?auto=format&fit=crop&q=80&w=1200" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ONYX &amp; STEEL" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ONYX &amp; STEEL" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ONYX &amp; STEEL — The Modern Gentleman's Sanctuary" />
    <meta
      name="twitter:description"
      content="A premier grooming destination where time-honored artistry meets contemporary precision. Book your exclusive grooming experience."
    />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1532710093739-9470acff878f?auto=format&fit=crop&q=80&w=1200" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
